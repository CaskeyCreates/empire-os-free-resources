[project]
name = "adeditor"
version = "0.1.0"
description = "Turns a client's raw talking-head video into finished video ads."
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "requests",
    "python-dotenv",
    "numpy>=2.2.6",
    "mediapipe>=1.2.3",
    "pillow>=12.3.0",
]

[project.scripts]
adeditor = "adeditor.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adeditor"]

[tool.pytest.ini_options]
markers = [
    "render: slow tests that render with HyperFrames",
    "slow: tests that run a real model, a few seconds each",
]
addopts = "-m 'not render'"

[tool.uv]
# mediapipe leaves opencv-contrib-python unbounded, and 5.x has no macOS wheel yet.
constraint-dependencies = ["opencv-contrib-python<5"]
